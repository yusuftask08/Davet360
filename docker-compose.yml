services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Self-hosted analytics (Google Analytics'e ücretsiz alternatif). Prod'da Coolify'da ayrı
  # bir servis olarak da kurulabilir; local dev'de burada opsiyonel olarak çalıştırılır.
  umami-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami
    volumes:
      - umami_db_data:/var/lib/postgresql/data

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      DATABASE_URL: postgresql://umami:umami@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: change-me-umami-secret
    depends_on:
      - umami-db

volumes:
  mongo_data:
  umami_db_data:
